<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151617">
  <meta name="description" content="Create organic ASCII artwork instantly. Shape the texture, explore seeded compositions, and export PNG or editable SVG.">
  <title>Glyph Field — ASCII image studio</title>
  <link rel="stylesheet" href="vendor/dialkit.css">
  <link rel="stylesheet" href="vendor/ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="Glyph Field home">Glyph Field<span class="version">STUDIO</span></a>
    <span class="top-note">Organic forms, drawn in type.</span>
    <select id="export-format" hidden aria-hidden="true" tabindex="-1"><option value="png">PNG</option><option value="svg">SVG</option></select>
    <div id="toolbar"></div>
  </header>
  <main>
    <aside class="controls" aria-label="Artwork controls">
      <div class="intro"><h1>Composition</h1><p>Shape the field. Keep the character.</p></div>
      <section><div class="section-heading"><h2>Structure</h2><span>5 forms</span></div>
        <div class="forms" role="group" aria-label="Structure">
          <button class="form selected" data-form="mycelium" aria-pressed="true" title="Branching networks"><span class="form-icon" data-icon="GitBranch"></span><span class="form-name">Mycelium</span><span class="form-desc">Branching networks</span></button>
          <button class="form" data-form="islands" aria-pressed="false" title="Scattered landforms"><span class="form-icon" data-icon="CircleDot"></span><span class="form-name">Archipelago</span><span class="form-desc">Scattered landforms</span></button>
          <button class="form" data-form="ribbons" aria-pressed="false" title="Winding channels"><span class="form-icon" data-icon="Waves"></span><span class="form-name">Currents</span><span class="form-desc">Winding channels</span></button>
          <button class="form" data-form="contours" aria-pressed="false" title="Nested elevations"><span class="form-icon" data-icon="Layers"></span><span class="form-name">Contours</span><span class="form-desc">Nested elevations</span></button>
          <button class="form" data-form="cells" aria-pressed="false" title="Organic membranes"><span class="form-icon" data-icon="Hexagon"></span><span class="form-name">Cellular</span><span class="form-desc">Organic membranes</span></button>
        </div>
        <p id="structure-description" class="structure-description">Branching networks</p>
      </section>
      <section class="texture" aria-label="Live texture and motion controls">
        <div id="dial-panel"></div>
        <input id="accent-color" type="hidden" value="#eeeeee"><div id="palette"></div>
        <div id="reset-control"></div>
      </section>
      <section><div class="section-heading"><h2>Canvas</h2></div><div class="canvas-options"><div class="canvas-option"><span class="field-label">Ratio</span><select id="ratio" hidden aria-hidden="true" tabindex="-1"><option value="4:5">Portrait · 4:5</option><option value="1:1">Square · 1:1</option><option value="16:9">Landscape · 16:9</option><option value="9:16">Story · 9:16</option></select><div id="ratio-select"></div></div><div class="canvas-option"><span class="field-label">Export size</span><select id="resolution" hidden aria-hidden="true" tabindex="-1"><option value="2048">2K · 2048 px</option><option value="4096">4K · 4096 px</option></select><div id="resolution-select"></div></div></div>
        <label class="seed-label" for="seed">Seed <span>Repeat a composition</span></label><div class="seed-wrap"><input id="seed" value="781204" maxlength="24" spellcheck="false" aria-label="Composition seed"><span id="seed-apply"></span></div>
      </section>
      <p class="local-note">Made in your browser. Yours to keep.</p>
    </aside>
    <section class="workspace" aria-label="Image preview">
      <div class="preview-top"><div><span id="art-title">MYCELIUM</span><span class="slash">/</span><span class="seed-prefix">Seed</span><span id="seed-display">781204</span></div><span id="dimensions">1638 × 2048</span></div>
      <div class="art-stage"><canvas id="art" width="800" height="1000" role="img" aria-label="Generated organic ASCII artwork with white and gray glyphs on charcoal"></canvas></div>
      <div class="preview-bottom"><span class="preview-label"><i aria-hidden="true"></i>Live preview</span><span id="render-status" role="status" aria-live="polite">Ready</span></div>
      <div class="history-header"><h2>Recent compositions <span id="history-count">01</span></h2><span>Select to restore</span></div><div id="history" class="history" aria-label="Recent compositions"></div>
    </section>
  </main>
  <script src="vendor/dialkit.js"></script>
  <script src="vendor/motion.js"></script>
  <script src="vendor/ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
